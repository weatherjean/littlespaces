# Static configuration for a dedicated Traefik v3 instance.
entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    forwardedHeaders:
      insecure: false
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 360s
        idleTimeout: 180s
providers:
  file:
    filename: /etc/littlespaces/traefik-dynamic.yml
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: operator@example.com
      storage: /var/lib/traefik/acme.json
      httpChallenge:
        entryPoint: web
log:
  level: WARN
# Access logging stays disabled: callback queries and preview paths carry credentials.
