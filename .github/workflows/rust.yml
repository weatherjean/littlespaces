name: Rust monolith core

on:
  push:
    branches: [main, rework/rust-monolith-rhai]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-core-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - name: Format
        run: cargo +stable fmt --manifest-path rust/Cargo.toml --check
      - name: Clippy
        run: cargo +stable clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings

  regression:
    name: Core regression (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.84.1 --profile minimal
      - name: Focused core regressions (synthetic HTTP only)
        run: cargo +1.84.1 test --manifest-path rust/Cargo.toml --locked
      - name: Build single executable
        run: cargo +1.84.1 build --manifest-path rust/Cargo.toml --locked
      - name: Persisted app CLI smoke
        run: python3 scripts/monolith-smoke.py
