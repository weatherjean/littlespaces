name: Rhai monolith prototype
on:
  push:
    branches: [prototype/rust-monolith-rhai]
  pull_request:
    paths: ['prototypes/rhai-monolith/**', '.github/workflows/rhai-prototype.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rhai-prototype-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  feasibility:
    name: Feasibility (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: prototypes/rhai-monolith
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install 1.84.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.84.1
      - name: Check source and run bounded experiments
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked -- --nocapture
      - name: Build standalone release executable
        run: cargo build --release --locked
      - name: Exercise real HTTP and synthetic AI loop
        run: |
          python3 scripts/smoke.py
          ./target/release/littlespaces-rhai-prototype --bench > reports/bench.json
          ls -l target/release/littlespaces-rhai-prototype > reports/binary-size.txt
      - name: Save synthetic measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rhai-feasibility-${{ matrix.arch }}
          path: prototypes/rhai-monolith/reports/
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: warn
