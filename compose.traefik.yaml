services:
  gateway:
    command:
      - --entrypoints.app.address=:443
      - --entrypoints.app.transport.respondingtimeouts.writeTimeout=360s
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=app
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.ping.address=:8082
      - --ping.entrypoint=ping
      - --providers.file.filename=/etc/traefik/routes.yml
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --log.level=WARN
    environment:
      LITTLESPACES_TLS: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme:/acme
volumes:
  acme:
