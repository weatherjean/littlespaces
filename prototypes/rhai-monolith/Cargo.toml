[package]
name = "littlespaces-rhai-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
publish = false

[dependencies]
rhai = { version = "=1.26.1", default-features = false, features = ["std", "serde", "no_module", "no_closure"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
rand = "0.8"
url = "=2.5.2"
zeroize = "=1.8.1"
jsonschema = { version = "=0.26.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
