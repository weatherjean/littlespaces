services:
  gateway:
    ports:
      - "127.0.0.1:1455:1455"
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d}
    restart: unless-stopped
    network_mode: service:gateway
    depends_on:
      gateway:
        condition: service_started
        restart: true
    environment:
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-littlespaces}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    secrets: [tailscale_authkey]
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./deploy/container/tailscale-serve.json:/config/serve.json:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9002/healthz]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 6
secrets:
  tailscale_authkey:
    file: ${TAILSCALE_AUTHKEY_FILE:-./deploy/secrets/tailscale_authkey}
volumes:
  tailscale_state:
