[package]
name = "little-spaces"
version = "0.1.0"
license = "MIT"
edition = "2021"
rust-version = "1.84"

[dependencies]
aes-gcm = "0.10"
axum = "0.7.9"
jsonschema = { version = "=0.26.2", default-features = false }
rand = "0.8"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rhai = { version = "=1.26.1", default-features = false, features = ["std", "serde", "no_module", "no_closure"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
url = "=2.5.2"
zeroize = "=1.8.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
