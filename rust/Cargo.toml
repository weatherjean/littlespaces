[package]
name = "little-spaces"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
axum = "0.7.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rquickjs = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
