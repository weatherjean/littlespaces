[package]
name = "little-spaces"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
axum = { version = "0.7.9", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rquickjs = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
libc = "0.2"

scrypt = "0.11"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
subtle = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "3"
url = "=2.5.2"
reqwest = { version = "=0.12.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
regex = "1"
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
jsonschema = { version = "=0.26.2", default-features = false }
zeroize = "=1.8.1"

web-push = { version = "=0.10.4", default-features = false }
p256 = { version = "0.13", features = ["ecdsa"] }

ece = "=2.3.1"

ed25519-compact = "=2.1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
